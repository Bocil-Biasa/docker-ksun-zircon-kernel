name: Download zircon-t-oss + Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo lo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Downloading ZIP...
        run: |
          wget -O zircon-t-oss.zip https://github.com/MiCode/Xiaomi_Kernel_OpenSource/archive/refs/heads/zircon-t-oss.zip

      - name: Unzipping...
        run: |
          unzip -q zircon-t-oss.zip
          rm zircon-t-oss.zip
          mv Xiaomi_Kernel_OpenSource-zircon-t-oss/* .
          mv Xiaomi_Kernel_OpenSource-zircon-t-oss/.* . 2>/dev/null || true
          rmdir Xiaomi_Kernel_OpenSource-zircon-t-oss || true

      - name: Checking files...
        run: |
          echo "=== Makefile ==="
          head -5 Makefile
          echo ""
          echo "=== arch folder ==="
          ls arch/ | head -10

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add zircon-t-oss kernel source (5.15.94)" || echo "No changes to commit"
          git push
